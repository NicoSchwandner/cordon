services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cordon
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 10

  migrate:
    image: migrate/migrate:v4.17.0
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations
    command:
      [
        "-path",
        "/migrations",
        "-database",
        "postgres://postgres:postgres@postgres:5432/cordon?sslmode=disable",
        "up",
      ]

  server:
    build: .
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "8443:8443"
    environment:
      PORT: "8443"
      DATABASE_URL: "postgres://postgres:postgres@postgres:5432/cordon?sslmode=disable"
      AUTH_MODE: "static"
      CORDON_INSECURE: "true"
      DEFAULT_TENANT_ID: "00000000-0000-0000-0000-000000000001"

volumes:
  pgdata:
