# Air - Go hot reload config
# https://github.com/air-verse/air

root = "."
tmp_dir = "tmp"

[build]
  bin = "./tmp/cordon-server"
  cmd = "go build -o ./tmp/cordon-server ./cmd/server"
  delay = 500
  exclude_dir = ["tmp", "web", "node_modules", "docs", "migrations", ".git"]
  exclude_regex = ["_test\\.go$"]
  include_ext = ["go"]
  kill_delay = 500
  send_interrupt = true
  stop_on_error = true

[log]
  time = false
  main_only = false

[screen]
  clear_on_rebuild = false

[misc]
  clean_on_exit = true
